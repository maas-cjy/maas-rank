name: 自动更新榜单数据并部署

on:
  schedule:
    # 每周一 09:30（北京时间）自动运行
    - cron: '30 1 * * 1'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动触发
  push: # 代码改动推送到 main 时自动重新部署（数据目录除外，避免重复触发）
    branches: [main]
    paths:
      - 'index.html'
      - 'compare.html'
      - 'model.html'
      - 'report.html'
      - 'about.html'
      - 'css/**'
      - 'js/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/**'
      - '.github/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 运行数据抓取
        run: python scripts/fetch_data.py

      - name: 提交并推送（数据有变化才提交）
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models.json data/.last_update.json
          if [ -f data/history.json ]; then
            git add data/history.json
          fi
          if git diff --cached --quiet -- data/models.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新榜单数据 $(date +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    needs: update-data
    # 数据有变化、手动触发、或代码 push 时，都重新部署
    if: needs.update-data.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # update-data 可能已经提交了新的 models.json，因此 deploy-pages 必须显式
      # checkout main 最新,而不是 workflow run 触发时的固定 commit,否则部署的
      # 还是旧数据。
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
