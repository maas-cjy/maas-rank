name: 自动更新榜单数据并部署

on:
  schedule:
    # 每天 09:30（北京时间）检查一次。
    # 榜单本身按周更新，每天跑是为了「补偿」：某天数据源抽风（如 2026-11-13
    # HuggingFace 转换任务被终止），第二天还能自动补上，不至于整周停更。
    # 无变化时不会提交、也不会生成文章（幂等），正常周仍只有一次提交。
    - cron: '30 1 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动触发
  push: # 代码改动推送到 main 时自动重新部署（数据目录除外，避免重复触发）
    branches: [main]
    paths:
      - 'index.html'
      - 'rank.html'
      - 'compare.html'
      - 'model.html'
      - 'report.html'
      - 'articles.html'
      - 'about.html'
      - 'baidu_verify_*.html' # 百度站长验证文件（更换验证文件也自动触发部署）
      - 'google*.html' # Google Search Console 验证文件
      - 'css/**'
      - 'js/**'
      - 'articles/**'
      - 'scripts/**'
      - 'data/**' # 数据目录（手动补更/修数据推送时触发部署）
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 运行数据抓取
        run: python scripts/fetch_data.py

      - name: 检查数据源健康度
        # 生成 data/health.json：连续抓取失败或数据长期无变化时，站点顶部会显示提示条
        run: python scripts/check_health.py

      - name: 判断本期是否有实质更新
        id: diff
        # changed：确有数据变化 → 生成文章、提交、部署
        # unhealthy：数据源异常 → 也要提交，让健康度与告警条能反映出来
        run: |
          CHANGED=$(python3 -c "import json;d=json.load(open('data/.last_update.json'));print('true' if d.get('changes') else 'false')")
          UNHEALTHY=$(python3 -c "import json;d=json.load(open('data/health.json'));print('true' if d.get('status')!='ok' else 'false')")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "unhealthy=$UNHEALTHY" >> "$GITHUB_OUTPUT"
          echo "数据变化=$CHANGED 健康异常=$UNHEALTHY"

      - name: 生成本周榜单解读文章
        if: steps.diff.outputs.changed == 'true'
        run: python scripts/gen_weekly_article.py

      # 常青文章属于「锦上添花」：单个生成器出 bug 时不应拖累整条更新链，
      # 否则数据抓取成功、却因为一篇文章崩掉导致站点整周不更新（2026-11-09 就是这样）。
      - name: 刷新选型指南
        id: guide
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: python scripts/gen_guide_article.py

      - name: 刷新厂商盘点
        id: provider
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: python scripts/gen_provider_article.py

      - name: 刷新模型对比实测
        id: compare
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: python scripts/gen_compare_article.py

      - name: 重新生成 sitemap 与 robots
        run: python scripts/gen_sitemap.py

      - name: 检查常青文章生成结果
        if: always()
        run: |
          failed=""
          [ "${{ steps.guide.outcome }}" = "failure" ] && failed="$failed 选型指南"
          [ "${{ steps.provider.outcome }}" = "failure" ] && failed="$failed 厂商盘点"
          [ "${{ steps.compare.outcome }}" = "failure" ] && failed="$failed 模型对比"
          if [ -n "$failed" ]; then
            echo "::warning::常青文章生成失败:$failed（已保留上一版，数据与周报照常更新）"
          else
            echo "全部常青文章生成成功"
          fi

      - name: 提交并推送（有更新或健康异常才提交）
        id: commit
        # 每天都会运行，但只在「确有新数据」或「数据源异常」时提交，
        # 避免无意义的每日空提交把 git 历史刷满。
        if: steps.diff.outputs.changed == 'true' || steps.diff.outputs.unhealthy == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models.json data/.last_update.json data/prev.json data/health.json
          if [ -f data/history.json ]; then
            git add data/history.json
          fi
          if [ -f data/articles.json ]; then
            git add data/articles.json
          fi
          if [ -d articles ]; then
            git add articles/
          fi
          git add sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新榜单数据 $(date +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    needs: update-data
    # 数据有变化、手动触发、或代码 push 时，都重新部署
    if: needs.update-data.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # update-data 可能已经提交了新的 models.json，因此 deploy-pages 必须显式
      # checkout main 最新,而不是 workflow run 触发时的固定 commit,否则部署的
      # 还是旧数据。
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4

  health-gate:
    # 部署完成后再判定数据源健康度：任务变红会触发 GitHub 的失败通知，
    # 避免「抓取一直失败、页面看起来却正常」的静默停更再次发生。
    needs: [update-data, deploy-pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 数据源连续异常则标记任务失败
        run: python scripts/check_health.py --strict --check-only
